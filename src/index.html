<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goblin Game</title>
</head>
<body>
  <div class="wrapper">
    <div class="game-area">
      <h1>Бей гоблина!</h1>
      <p class="subtitle">5 промахов — игра окончена</p>
      <div class="game-container"></div>
    </div>
    <div class="sidebar">
      <div class="scoreboard">
        <div class="score-item">
          <span class="label">Счёт</span>
          <b class="score">0</b>
        </div>
        <div class="score-item">
          <span class="label">Промахи</span>
          <b class="misses">0</b><span> / 5</span>
        </div>
      </div>
      <div class="status"></div>
      <button class="start-btn">Начать игру</button>
    </div>
  </div>
</body>
</html>
